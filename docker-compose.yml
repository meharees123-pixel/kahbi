services:
  api:
    build:
      context: ./server
    image: kahbi-api
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in root .env}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      CURRENCY: QAR
      DEFAULT_SERVICE_RADIUS_KM: ${DEFAULT_SERVICE_RADIUS_KM:-20}
      RESTAURANT_ACCEPTANCE_SLA_MINUTES: ${RESTAURANT_ACCEPTANCE_SLA_MINUTES:-5}
      CUSTOMER_CANCELLATION_WINDOW_MINUTES: ${CUSTOMER_CANCELLATION_WINDOW_MINUTES:-5}
      DEFAULT_DELIVERY_FEE: ${DEFAULT_DELIVERY_FEE:-0}
      CUSTOMER_ADMIN_FEE: ${CUSTOMER_ADMIN_FEE:-0}
      RESTAURANT_COMMISSION_PERCENT: ${RESTAURANT_COMMISSION_PERCENT:-12}
      WHATSAPP_MODE: demo
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-kahbi_customer_otp}
      WHATSAPP_OTP_LANGUAGE: ${WHATSAPP_OTP_LANGUAGE:-en_US}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v23.0}
      OTP_SIGNING_SECRET: ${OTP_SIGNING_SECRET:-}
      WHATSAPP_CONFIG_ENCRYPTION_KEY: ${WHATSAPP_CONFIG_ENCRYPTION_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      seed:
        condition: service_completed_successfully

  seed:
    build:
      context: ./server
    image: kahbi-api
    command: ["npm", "run", "seed"]
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in root .env}

  web:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - api

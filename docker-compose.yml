services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./server
    image: kahbi-api
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: ${REDIS_URL}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in root .env}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}

      CURRENCY: QAR
      DEFAULT_SERVICE_RADIUS_KM: ${DEFAULT_SERVICE_RADIUS_KM:-2}
      RESTAURANT_ACCEPTANCE_SLA_MINUTES: ${RESTAURANT_ACCEPTANCE_SLA_MINUTES:-5}
      CUSTOMER_CANCELLATION_WINDOW_MINUTES: ${CUSTOMER_CANCELLATION_WINDOW_MINUTES:-5}
      DEFAULT_DELIVERY_FEE: ${DEFAULT_DELIVERY_FEE:-0}
      CUSTOMER_ADMIN_FEE: ${CUSTOMER_ADMIN_FEE:-0}
      RESTAURANT_COMMISSION_PERCENT: ${RESTAURANT_COMMISSION_PERCENT:-12}

      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-kabhiofficial}

      CUSTOMER_OTP_ENABLED: ${CUSTOMER_OTP_ENABLED:-true}
      RECOVERY_OTP_TTL_MINUTES: ${RECOVERY_OTP_TTL_MINUTES:-5}

      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v23.0}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-1053506627676876}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_PHONE_NUMBER: ${WHATSAPP_BUSINESS_PHONE_NUMBER:-97431278062}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_TEST_MODE: ${WHATSAPP_TEST_MODE:-false}
      WHATSAPP_TEST_POPUP_ENABLED: ${WHATSAPP_TEST_POPUP_ENABLED:-false}

      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-kabhioffical92@gmail.com}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-KABHI}

    ports:
      - "3000:3000"

    depends_on:
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  seed:
    build:
      context: ./server
    image: kahbi-api
    command: ["npm", "run", "seed"]
    environment:
      REDIS_URL: ${REDIS_URL}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in root .env}

  web:
    build:
      context: ./client
      dockerfile: Dockerfile.prod

    restart: unless-stopped

    ports:
      - "127.0.0.1:4200:8080"

    depends_on:
      - api
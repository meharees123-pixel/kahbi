name: Build and deploy KABHI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kahbi-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Install dependencies
        run: npm run install:all

      - name: Run backend tests
        run: npm test

      - name: Build Angular application
        run: npm run build

  deploy:
    name: Deploy to Google Cloud Run
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.KAHBI_GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      MONGODB_SECRET: ${{ vars.GCP_MONGODB_SECRET }}
      JWT_SECRET: ${{ vars.GCP_JWT_SECRET }}
      OTP_SIGNING_SECRET: ${{ vars.GCP_OTP_SIGNING_SECRET }}
      WHATSAPP_ENCRYPTION_SECRET: ${{ vars.GCP_WHATSAPP_ENCRYPTION_SECRET }}
      GEMINI_API_KEY_SECRET: ${{ vars.GCP_GEMINI_API_KEY_SECRET }}
      CLIENT_ORIGIN: ${{ vars.GCP_CLIENT_ORIGIN }}
      API_SERVICE: ${{ vars.GCP_API_SERVICE || 'kahbi-api' }}
      WEB_SERVICE: ${{ vars.GCP_WEB_SERVICE || 'kahbi-web' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          required=(GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY RUNTIME_SERVICE_ACCOUNT MONGODB_SECRET JWT_SECRET OTP_SIGNING_SECRET WHATSAPP_ENCRYPTION_SECRET GEMINI_API_KEY_SECRET CLIENT_ORIGIN)
          missing=()
          for key in "${required[@]}"; do
            if [[ -z "${!key}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing GitHub Actions repository variables: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ ! "$CLIENT_ORIGIN" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "GCP_CLIENT_ORIGIN must be a public HTTPS origin without a path."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry
        shell: bash
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push production images
        id: build_images
        shell: bash
        run: |
          image_root="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/kahbi"
          docker build --file server/Dockerfile --tag "${image_root}-api:${GITHUB_SHA}" server
          docker build --file client/Dockerfile.prod --tag "${image_root}-web:${GITHUB_SHA}" client
          docker push "${image_root}-api:${GITHUB_SHA}"
          docker push "${image_root}-web:${GITHUB_SHA}"
          echo "api_image=${image_root}-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_image=${image_root}-web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy API to Cloud Run
        id: deploy_api
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.API_SERVICE }}
          image: ${{ steps.build_images.outputs.api_image }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          env_vars: |-
            NODE_ENV=production
            CURRENCY=QAR
            CLIENT_ORIGIN=${{ env.CLIENT_ORIGIN }}
            GEMINI_MODEL=gemini-2.5-flash
          secrets: |-
            MONGODB_URI=${{ env.MONGODB_SECRET }}:latest
            JWT_SECRET=${{ env.JWT_SECRET }}:latest
            OTP_SIGNING_SECRET=${{ env.OTP_SIGNING_SECRET }}:latest
            WHATSAPP_CONFIG_ENCRYPTION_KEY=${{ env.WHATSAPP_ENCRYPTION_SECRET }}:latest
            GEMINI_API_KEY=${{ env.GEMINI_API_KEY_SECRET }}:latest
          flags: >-
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --port=8080
            --memory=1Gi
            --cpu=1
            --max=10
            --allow-unauthenticated

      - name: Deploy web app to Cloud Run
        id: deploy_web
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.WEB_SERVICE }}
          image: ${{ steps.build_images.outputs.web_image }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          env_vars: |-
            API_UPSTREAM=${{ steps.deploy_api.outputs.url }}
          flags: >-
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --port=8080
            --memory=256Mi
            --cpu=1
            --max=10
            --allow-unauthenticated

      - name: Report deployed URL
        run: echo "KABHI deployed successfully at ${{ steps.deploy_web.outputs.url }}"
